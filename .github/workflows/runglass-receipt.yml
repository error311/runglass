name: RunGlass Receipt

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  receipt:
    name: Dogfood CI receipt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install RunGlass from this checkout
        run: cargo install --path crates/runglass-cli --locked

      - name: Run tests through RunGlass
        run: runglass ci --provider github --output runglass-receipt -- cargo test --workspace --locked

      - name: Upload RunGlass receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runglass-receipt
          path: runglass-receipt/

      - name: Comment RunGlass receipt on PR
        if: always() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && hashFiles('runglass-receipt/receipt.json') != ''
        run: runglass github comment --receipt runglass-receipt/receipt.json --auto
        env:
          GITHUB_TOKEN: ${{ github.token }}
