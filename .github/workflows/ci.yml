name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Package runglass-core
        run: cargo package -p runglass-core --locked

      - name: Check runglass-web package file list
        run: cargo package -p runglass-web --locked --list

      - name: Check runglass package file list
        run: cargo package -p runglass --locked --list

  msrv:
    name: Rust 1.86 MSRV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.86
        uses: dtolnay/rust-toolchain@1.86.0

      - name: Check workspace with declared MSRV
        run: cargo check --workspace --all-targets --locked

  debian-package:
    name: Debian package
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install package test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes man-db

      - name: Build release binary
        run: cargo build --release --locked -p runglass

      - name: Build and inspect Debian package
        run: |
          version=$(target/release/runglass --version | awk '{print $2}')
          ./packaging/debian/verify-package.sh "$version" target/release/runglass

      - name: Install and remove Debian package
        run: |
          set -euo pipefail
          version=$(target/release/runglass --version | awk '{print $2}')
          sudo apt-get install --yes "./dist/runglass_${version}_amd64.deb"
          test "$(/usr/bin/runglass --version)" = "runglass $version"
          test -f /usr/share/man/man1/runglass.1.gz
          gzip --decompress --stdout /usr/share/man/man1/runglass.1.gz \
            | groff -man -Tutf8 > /tmp/runglass-man.txt
          grep -F "Run any command" /tmp/runglass-man.txt
          dpkg-query --listfiles runglass
          sudo apt-get remove --yes runglass
          test ! -e /usr/bin/runglass
          test ! -e /usr/share/man/man1/runglass.1.gz

  macos:
    name: macOS readiness
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Test cross-platform CLI surface
        run: cargo test -p runglass --bin runglass --locked

      - name: Build release binary
        run: cargo build --release --locked -p runglass

      - name: Smoke test non-observation commands
        run: |
          target/release/runglass --version
          target/release/runglass --help
          target/release/runglass doctor
          target/release/runglass demo
          target/release/runglass validate latest

      - name: Verify observation guard
        run: |
          set +e
          output="$(target/release/runglass run -- echo hello 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error::runglass run unexpectedly succeeded on macOS"
            exit 1
          fi
          echo "$output" | grep "Linux-first"
