[package]
name = "runglass"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Run one command and get a live receipt of what happened."

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
runglass-core = { path = "../runglass-core", version = "0.2.4" }
runglass-web = { path = "../runglass-web", version = "0.2.4" }
serde_json = "1.0"
ureq = { version = "2.12", features = ["json"] }

[[bin]]
name = "runglass"
path = "src/main.rs"
